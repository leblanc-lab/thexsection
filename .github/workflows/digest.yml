name: Daily digest

on:
  schedule:
    # arXiv announces the new batch around 8 PM Eastern, but the RSS feeds can
    # read empty around midnight Eastern while they roll over (05:07 UTC hit that
    # in EST and missed 11-03/11-10/11-13). GitHub cron is UTC-only (no DST), so
    # 07:07 UTC = 2:07 AM EST (winter) / 3:07 AM EDT (summer): well clear of the
    # rollover and still done well before morning.
    - cron: "7 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill date YYYY-MM-DD (fetches by submission date)"
        required: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # The default is 6h; a stalled run should surface in minutes, not burn a
    # whole runner-day. Comfortably above a normal run (under 30 min); the LLM
    # step below has its own tighter budget so build + commit always get time.
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Present only when the SMTP secrets are configured; the reminder step
      # below checks env.MAIL_USERNAME and skips itself when they're absent.
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch today's papers
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m pipeline.fetch --backfill "${{ inputs.date }}"
          else
            python -m pipeline.fetch
          fi

      - name: Digest, deep dives, watchlist, radar (Fridays), memory
        id: llm
        # Killed here (a step failure, not a job cancel) so the build + commit
        # steps still run and keep whatever stages finished.
        timeout-minutes: 100
        run: |
          # Run-wide budget for Batches API waits: past this, pipeline/llm.py
          # stops batching and calls synchronously, leaving ~20 min for the
          # remaining stages to finish at full price inside the step timeout.
          export LLM_RUN_DEADLINE=$(( $(date +%s) + 80 * 60 ))
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then DATE_ARG="--date ${{ inputs.date }}"; fi
          python -m pipeline.digest $DATE_ARG
          python -m pipeline.deep_dive $DATE_ARG
          python -m pipeline.watchlist $DATE_ARG
          # Zero-LLM keyword/author scan: abstract-only entries for mirrored
          # streams the briefing didn't cover (and brief:false topics).
          python -m pipeline.scan $DATE_ARG
          if [ "$(date -u +%u)" = "5" ] && [ -z "$DATE_ARG" ]; then
            python -m pipeline.radar
          fi
          python -m pipeline.memory $DATE_ARG

      # `!cancelled()` (not the default `success()`): if the LLM step failed or
      # timed out partway, still publish and commit the stages that finished.
      - name: Build site
        if: ${{ !cancelled() }}
        run: python -m pipeline.build_site

      - name: Commit results
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "The Cross Section bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            DIGEST_DATE="${{ inputs.date }}"
            [ -n "$DIGEST_DATE" ] || DIGEST_DATE="$(date -u +%F)"
            MSG="digest: $DIGEST_DATE"
            [ "${{ steps.llm.outcome }}" = "success" ] || MSG="$MSG (partial: LLM step ${{ steps.llm.outcome }})"
            git commit -m "$MSG"
            git pull --rebase origin main
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "date=$DIGEST_DATE" >> "$GITHUB_OUTPUT"
            # Friday is the week's last posting day (no weekend arXiv), so the
            # rolling Long View is now final for the week — flag it for the
            # weekend Substack post. Real cron Fridays only, not date backfills.
            if [ "$(date -u +%u)" = "5" ] && [ -z "${{ inputs.date }}" ]; then
              echo "friday=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Mirror today's digest to Substack as a DRAFT for review. Never publishes
      # (that stays a manual click in Substack). Skips quietly if the cookie
      # secret is unset, and continue-on-error keeps a stale/expired cookie from
      # failing the already-committed digest run. No digest on a no-paper day →
      # the module no-ops. Add SUBSTACK_COOKIES under Settings → Secrets → Actions.
      - name: Draft to Substack (review-only)
        if: ${{ !cancelled() && steps.commit.outputs.committed == 'true' }}
        continue-on-error: true
        env:
          SUBSTACK_COOKIES: ${{ secrets.SUBSTACK_COOKIES }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
        run: |
          if [ -z "$SUBSTACK_COOKIES" ]; then
            echo "SUBSTACK_COOKIES not set — skipping Substack draft."
            exit 0
          fi
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then DATE_ARG="--date ${{ inputs.date }}"; fi
          python -m pipeline.substack $DATE_ARG

      # Nudge to go publish the draft. Only fires when a digest was actually
      # committed, and self-skips unless the SMTP secrets are set: MAIL_USERNAME
      # + MAIL_PASSWORD (a Gmail app password work well) and MAIL_TO (recipient).
      - name: Email a publish reminder
        if: ${{ !cancelled() && steps.commit.outputs.committed == 'true' && env.MAIL_USERNAME != '' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: The Cross Section <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "The Cross Section — draft ready to publish (${{ steps.commit.outputs.date }})"
          body: |
            A new digest for ${{ steps.commit.outputs.date }} is committed and drafted to Substack.

            To publish it (and email subscribers), do either:

            • Run the "Post to Substack" workflow with publish = true:
              https://github.com/${{ github.repository }}/actions/workflows/substack.yml

            • Or from a local checkout:
              python -m pipeline.substack --date ${{ steps.commit.outputs.date }} --publish

            Review the draft in Substack's editor first, then publish.

            — The Cross Section bot

      # Fridays only: the week's Long View is now final. Draft it to Substack as
      # a review-only draft, mirroring the daily-digest draft above. Skips
      # quietly without a cookie; continue-on-error keeps a stale cookie from
      # failing the committed run.
      - name: Draft the Long View to Substack (Fridays)
        if: ${{ !cancelled() && steps.commit.outputs.friday == 'true' }}
        continue-on-error: true
        env:
          SUBSTACK_COOKIES: ${{ secrets.SUBSTACK_COOKIES }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
        run: |
          if [ -z "$SUBSTACK_COOKIES" ]; then
            echo "SUBSTACK_COOKIES not set — skipping Long View draft."
            exit 0
          fi
          python -m pipeline.substack --kind longview

      # Fridays only: nudge to publish the Long View over the weekend, when
      # there's no daily digest to post. Same SMTP self-skip as the digest one.
      - name: Email a Long View reminder (Fridays)
        if: ${{ !cancelled() && steps.commit.outputs.friday == 'true' && env.MAIL_USERNAME != '' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: The Cross Section <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "The Cross Section — this week's Long View is ready (${{ steps.commit.outputs.date }})"
          body: |
            This week's Long View (the rolling weekly synthesis) is now final and
            drafted to Substack — a good weekend post for the days with no daily digest.

            To publish it (and email subscribers), do either:

            • Run the "Post to Substack" workflow with kind = longview, publish = true:
              https://github.com/${{ github.repository }}/actions/workflows/substack.yml

            • Or from a local checkout:
              python -m pipeline.substack --kind longview --publish

            Review the draft in Substack's editor first, then publish.

            — The Cross Section bot
