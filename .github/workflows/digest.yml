name: Daily digest

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC, comfortably after arXiv's overnight announcement
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill date YYYY-MM-DD (fetches by submission date)"
        required: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch today's papers
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m pipeline.fetch --backfill "${{ inputs.date }}"
          else
            python -m pipeline.fetch
          fi

      - name: Digest, deep dives, radar (Fridays), memory
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then DATE_ARG="--date ${{ inputs.date }}"; fi
          python -m pipeline.digest $DATE_ARG
          python -m pipeline.deep_dive $DATE_ARG
          if [ "$(date -u +%u)" = "5" ] && [ -z "$DATE_ARG" ]; then
            python -m pipeline.radar
          fi
          python -m pipeline.memory $DATE_ARG

      - name: Build site
        run: python -m pipeline.build_site

      - name: Commit results
        run: |
          git config user.name "arxiv-vibes bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data digests memory site
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "digest: $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
