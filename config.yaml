    # No bare "EMD": it matched early-matter-domination and
    # Einstein-Maxwell-dilaton papers. "energy mover" covers the real ones.
    - name: "Optimal transport"
      page: true
      slug: optimal-transport
      theme: default
      tagline: "Moving earth between distributions"
      # "optimal transport" is word-bounded, so it doesn't cover "optimal
      # transportation" (the -ation suffix breaks the boundary) — that's a real
      # phrasing some papers use (e.g. 2505.13063). Bare "Monge"/"Kantorovich"
      # were tried and dropped: they pull in unrelated GR "Monge patch" and
      # Newton-Kantorovich numerical-method papers.
