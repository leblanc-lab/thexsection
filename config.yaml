# The Cross Section configuration

site:
  title: "The Cross Section"
  tagline: "An AI-powered digest and trend analysis of hep-ex and hep-ph"
  # Public Substack URL for the "Subscribe" nav link. Leave blank to hide it.
  subscribe_url: "https://thexsection.substack.com"
  # Canonical published URL, trailing slash. RSS needs absolute links, so this is
  # the one place the deployed location is written down.
  base_url: "https://leblanc-lab.github.io/thexsection/"

arxiv:
  # arXiv category codes to track. Add/remove freely; papers cross-listed
  # between tracked categories are deduplicated.
  categories:
    - hep-ex
    - hep-ph
  # Announcement types to keep from the feeds ("new" and "cross"; "replace" is noisy).
  announce_types: [new, cross]

llm:
  # Active provider: "gemini" (free tier, dev/testing), "anthropic" (production),
  # or "claude-cli" (shells out to a logged-in `claude -p`; billed to the local
  # Claude subscription, not API credit — laptop-only fallback, not for CI).
  provider: anthropic
  # Route calls through the async Batches API: 50% cheaper token rates in exchange
  # for higher latency (usually minutes, cap 24h) — a good trade for the scheduled
  # overnight run. Gemini has no batch path here and falls back to synchronous
  # calls. Set false for snappy local iteration.
  batch: true
  # Batches normally land in 1-8 min, but the API's own cap is 24h — longer than
  # a CI job can live, so an unbounded wait turns one slow batch into a lost run
  # (this happened 2026-09-02). Give up well short of the 6h GitHub limit.
  batch_deadline_minutes: 45
  # On timeout, re-run the jobs synchronously at full price rather than losing
  # the day's digest. Set false to fail loudly instead.
  batch_fallback_sync: true
  providers:
    gemini:
      model: gemini-3.1-flash-lite-preview   # alias tracking the current flash model
      # AI Studio free tier — no cost.
      input_price_per_mtok: 0.0
      output_price_per_mtok: 0.0
    anthropic:
      model: claude-opus-4-8
      input_price_per_mtok: 5.00
      output_price_per_mtok: 25.00
    claude-cli:
      model: claude-opus-4-8
      # Subscription usage, so no marginal API cost to account for.
      input_price_per_mtok: 0.0
      output_price_per_mtok: 0.0

digest:
  # How many recent daily digests are fed back in as short-term context.
  daily_lookback: 7
  # Hard cap on assembled prompt tokens; abstracts are truncated (not dropped) beyond it.
  max_input_tokens: 400000
  # Adaptive thinking counts against this, so it is not a prose budget: on
  # 2026-07-20 thinking consumed the entire 8000 and no text block was emitted.
  # The digest itself targets 400-600 words (~900 tokens); the rest is headroom.
  max_output_tokens: 10000

deep_dive:
  # Number of standout papers to expand via their arXiv HTML rendering. 0 disables.
  count: 3
  # Token cap per paper after HTML → text stripping.
  max_tokens_per_paper: 25000
  max_output_tokens: 4000
  # Mirror every digest's "## Deep dives" section to its own page and RSS feed
  # (one item per paper), split out at build time — same knobs as a watchlist
  # topic below. Adds a "Deep dives" nav link. Remove `page` to turn it off.
  page: true
  slug: deep-dives
  theme: default
  tagline: "The standout papers, read in full"

memory:
  # Rolling synthesis tiers. Academic-year seasons: Autumn (Sep–Jan),
  # Spring (Feb–Apr), Summer (May–Aug). Year rolls on Sep 1.
  week_lookback_days: 7
  # Matches the digest cap: the week synthesis is dense, token-expensive physics
  # Unicode, and the old 3000 cap truncated it mid-bullet (2026-07-17).
  max_output_tokens: 8000

radar:
  # Weekly INSPIRE-HEP sweep for highly-cited recent papers we didn't deep-dive.
  enabled: true
  weekday: friday
  window_days: 90
  top_n: 5
  min_citations: 10
  max_output_tokens: 4000

watchlist:
  # Personal-interest keyword tracks. When a day's papers hit these keywords
  # (case-insensitive, matched in title + abstract), a focused deep summary is
  # written to a separate, subtly-linked page. Add topics/keywords freely.
  #
  # A topic may additionally be mirrored to its own page and RSS feed, split out
  # of the shared watch entries at build time:
  #   page: true      mirror this topic to site/<slug>/index.html + feed.xml
  #   slug:           URL segment for that directory
  #   theme:          renders with templates/topic_<theme>.html. `default` (or
  #                   omitted) is the house-style stream inside the main site's
  #                   shell; `muon` is a standalone sister publication with its
  #                   own static/muon.css.
  #   tagline:        subtitle on the topic page and in its feed
  # Topics without `page` stay watch-page-only.
  enabled: true
  page_title: "Standing waves"
  max_tokens_per_paper: 20000
  max_output_tokens: 4000
  topics:
    - name: "Muon collider"
      page: true
      slug: muon
      theme: muon
      tagline: "Towards 10 TeV, one paper at a time"
      keywords: ["muon collider", "muon-collider", "muon smasher", "MuC", "MAIA Detector", "MUSIC Detector"]
    # Hadronic final-state reconstruction broadly: substructure, clustering,
    # tagging, calibration, and the observables built on them. Deliberately no
    # bare "jet"/"dijet"/"quark-gluon"/"hadronization" — those pull in resonance
    # searches, QGP and freeze-out papers by the dozen.
    - name: "Jets and jet substructure"
      page: true
      slug: jets
      theme: default
      tagline: "Hadronic final states, from clustering to correlators"
      keywords:
        # substructure & observables
        - "jet substructure"
